[project]
name = "ableton-lite"
version = "0.1.0"
description = "SQLite + Ollama + FastMCP agent orchestration layer for Ableton MCP"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Alex Zheng"}
]
license = {text = "MIT"}
dependencies = [
    "fastmcp>=2.0.0",
    "aiosqlite>=0.19.0",
    "ollama>=0.4.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
ableton-lite = "ableton_lite.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ableton_lite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
