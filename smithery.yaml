To use Docker Desktop MCP Toolkit with the redis-mcp server in Antigravity IDE, follow these steps:

1. Enable MCP Toolkit in Docker Desktop
Open Docker Desktop.
Go to Settings > Beta features.
Enable Docker MCP Toolkit and apply changes.
2. Add the Redis MCP Server
In Docker Desktop, navigate to MCP Toolkit > Catalog.
Search for redis-mcp (or similar Redis server).
Click the plus icon to add it.
3. Connect Antigravity IDE as a Client
Go to MCP Toolkit > Clients tab.
Find Antigravity IDE in the list.
Click Connect.
Docker Desktop will automatically configure the MCP Gateway connection, allowing Antigravity IDE to access the Redis MCP server.
4. Use Redis MCP in Antigravity IDE
In Antigravity IDE, you can now interact with Redis via the MCP server.
For example, you might run queries, set/get keys, or automate workflows using Redis—all requests will be routed securely through Docker MCP Toolkit.
Notes
No manual dependency or runtime setup is needed; everything runs in isolated containers.
If Antigravity IDE is not listed, you can manually configure the MCP Gateway using the command:
docker mcp gateway run
and set up your IDE to communicate over stdio with the MCP server.
Summary:
Enable MCP Toolkit, add the Redis MCP server, connect Antigravity IDE as a client, and start using Redis securely and seamlessly in your development workflow.

