# Environment
OS: MACOS
IDE: ANTIGRAVITY
MODEL: GEMINI

# Ableton Settings
ABLETON_VERSION: "12.3.1"
ABLETON_EDITION: "Intro" # Intro, Standard, Suite

# Paths
REMOTE_SCRIPT_PATH: ~/Music/Ableton/User Library/Remote Scripts/AbletonMCP

# Docker
DOCKER_IMAGE_NAME: ableton-mcp
DOCKER_TAG: latest

# Connection
ABLETON_HOST: localhost
ABLETON_PORT: 9877
SOCKET_TIMEOUT: 10

# Debug
DEBUG: false
