# config.yaml - Local configuration (DO NOT COMMIT)
# Generated from config.template.yaml

# === Ableton ===
ableton:
  edition: suite # Developer has Suite edition
  port: 9877
  version: "12.3.1"

# === Paths ===
paths:
  remote_script: ~/Library/Preferences/Ableton/Live 12.3.1/User Remote Scripts/AbletonMCP
  mcp_config: ~/.gemini/antigravity/mcp_config.json
  ableton_log: ~/Library/Preferences/Ableton/Live 12.3.1/Log.txt

# === Docker ===
docker:
  image: ableton-mcp
  tag: latest

# === IDE ===
ide: antigravity
model: gemini
os: macos
