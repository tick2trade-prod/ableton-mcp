[project]
name = "ableton-mcp"
version = "1.0.0"
description = "Ableton Live integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "pathlib>=1.0.1",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "pytest-timeout>=2.4.0",
    "pydantic>=2.5",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-sugar",
    "pytest-timeout>=2.0.0",
    "pre-commit>=3.0.0",
    "ruff>=0.3.0",
]
analysis = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "demucs>=4.0.0",
    "torchcodec>=0.1.0; sys_platform != 'win32'",
]
gui = [
    "dearpygui>=1.11.0",
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
]

[project.scripts]
ableton-mcp = "src.ableton_mcp.server:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = "."

[tool.setuptools]
packages = ["MCP_Server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live: tests requiring live Ableton connection",
    "session: session/track related tests",
    "clip: clip manipulation tests",
    "device: device/rack tests",
    "browser: browser navigation tests",
    "transport: playback control tests",
]
norecursedirs = ["external"]
addopts = "-v --tb=short --timeout=300"

[tool.ruff]
line-length = 88
select = ["E", "F", "I", "UP", "B", "SIM"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/ableton-mcp"
"Bug Tracker" = "https://github.com/ahujasid/ableton-mcp/issues"
